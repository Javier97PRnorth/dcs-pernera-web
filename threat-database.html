<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="threats">
  <div id="site-nav-root"></div>

  <main class="threats-page">
    <section class="panel threats-panel">
      <header class="threats-header">
        <span class="section-kicker">Threat reference</span>
        <h1>Threat Database</h1>
        <p>A practical field reference for identifying surface, naval, radar, missile, and airborne threats in DCS World.</p>
      </header>

      <div class="threats-layout">
        <div class="threats-content">
          <div class="threats-controls">
            <label class="threat-control">
              <span>Search threats</span>
              <input id="threat-search" class="search-input" type="search" placeholder="Search by name, designation, range..." autocomplete="off">
            </label>
          </div>
          <div id="threat-results-count" class="threat-results-count" aria-live="polite"></div>
          <div id="threat-notes" class="threat-notes" hidden></div>
          <div class="threat-table-wrapper">
            <table class="threat-table threat-global-table" aria-label="Global DCS threat database">
              <thead>
                <tr>
                  <th>Threat / system</th>
                  <th>Threat type</th>
                  <th>Designation / platform</th>
                  <th>RWR / HARM</th>
                  <th>Range</th>
                  <th>Altitude</th>
                  <th>Guidance / role</th>
                  <th>Equipment</th>
                  <th>Other source data</th>
                </tr>
                <tr class="threat-filter-row">
                  <th><input class="threat-column-filter" data-threat-column="0" type="search" placeholder="Name" aria-label="Filter threat name"></th>
                  <th><select class="threat-column-filter" data-threat-column="1" aria-label="Filter threat type"><option value="">All</option></select></th>
                  <th><input class="threat-column-filter" data-threat-column="2" type="search" placeholder="Designation" aria-label="Filter designation or platform"></th>
                  <th><input class="threat-column-filter" data-threat-column="3" type="search" placeholder="RWR / HARM" aria-label="Filter RWR or HARM"></th>
                  <th><input class="threat-column-filter" data-threat-column="4" type="search" placeholder="Range" aria-label="Filter range"></th>
                  <th><input class="threat-column-filter" data-threat-column="5" type="search" placeholder="Altitude" aria-label="Filter altitude"></th>
                  <th><input class="threat-column-filter" data-threat-column="6" type="search" placeholder="Guidance" aria-label="Filter guidance or role"></th>
                  <th><input class="threat-column-filter" data-threat-column="7" type="search" placeholder="Equipment" aria-label="Filter equipment"></th>
                  <th><input class="threat-column-filter" data-threat-column="8" type="search" placeholder="Other" aria-label="Filter other source data"></th>
                </tr>
              </thead>
              <tbody id="threat-rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="site-config.js"></script>
  <script src="shared-nav.js"></script>
  <script src="data/threat-database.js"></script>
  <script src="threats.js"></script>
  <script src="main.js"></script>
</body>
</html>
