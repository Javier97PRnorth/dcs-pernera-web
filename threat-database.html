<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="threats">
  <div id="site-nav-root"></div>

  <main class="threats-page">
    <section class="panel threats-panel">
      <header class="threats-header">
        <span class="section-kicker">F/A-18C RWR reference</span>
        <h1>RWR Threat Tables</h1>
        <p>Radar Warning Receiver codes for identifying SAM systems, radars, aircraft, and naval contacts in DCS World.</p>
      </header>

      <div class="threats-layout">
        <div class="threats-content">
          <div class="threats-controls">
            <label class="threat-control">
              <span>Search threats</span>
              <input id="threat-search" class="search-input" type="search" placeholder="Search by name, designation, range..." autocomplete="off">
            </label>
          </div>
          <div id="threat-results-count" class="threat-results-count" aria-live="polite"></div>
          <div id="threat-notes" class="threat-notes" hidden></div>
          <div class="threat-table-wrapper">
            <table class="threat-table threat-global-table" aria-label="F/A-18C RWR threat tables">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>System / Aircraft</th>
                  <th>Type</th>
                  <th>Range (nm)</th>
                  <th>Vertical range (ft)</th>
                </tr>
                <tr class="threat-filter-row">
                  <th><input class="threat-column-filter" data-threat-column="0" type="search" placeholder="Code" aria-label="Filter RWR code"></th>
                  <th><input class="threat-column-filter" data-threat-column="1" type="search" placeholder="System" aria-label="Filter system or aircraft"></th>
                  <th><select class="threat-column-filter" data-threat-column="2" aria-label="Filter threat type"><option value="">All</option></select></th>
                  <th><input class="threat-column-filter" data-threat-column="3" type="search" placeholder="Range" aria-label="Filter range"></th>
                  <th><input class="threat-column-filter" data-threat-column="4" type="search" placeholder="Vertical" aria-label="Filter vertical range"></th>
                </tr>
              </thead>
              <tbody id="threat-rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="site-config.js"></script>
  <script src="shared-nav.js"></script>
  <script src="data/rwr-threat-database.js"></script>
  <script src="threats.js"></script>
  <script src="main.js"></script>
</body>
</html>
